<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP | Solar Group Smart Factory</title>
    <link rel="icon" type="image/png" href="/static/solars.png">

    <!-- Montserrat Font ONLY per Smart Factory Standard -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <style>
        :root {
            --canvas: #f3f4f5;
            --surface: #ffffff;
            --surface-2: #fafbfb;
            --ink: #212529;
            --ink-2: #464c53;
            --ink-3: #707070;
            --line: #e6e8ea;
            --brand-500: #ed1c24;
            --brand-600: #d31017;
            --accent-600: #1f3f80;
            --r-sm: 6px;
            --r-lg: 12px;
            --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-brand: 0 4px 14px rgba(237, 28, 36, 0.25);
        }

        body { 
            font-family: 'Montserrat', sans-serif;
            height: 100vh; 
            background-color: var(--canvas);
            background-image: 
                linear-gradient(to right, rgba(33, 37, 41, 0.028) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(33, 37, 41, 0.028) 1px, transparent 1px);
            background-size: 22px 22px;
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        .auth-panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--r-lg);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: var(--shadow-md);
            position: relative;
        }

        .auth-panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--brand-500);
            border-radius: var(--r-lg) var(--r-lg) 0 0;
        }

        .logo-img {
            height: 36px;
            width: auto;
            max-width: 180px;
            object-fit: contain;
            margin-bottom: 20px;
            border: none !important;
            box-shadow: none !important;
            background: transparent !important;
        }

        .otp-input {
            font-family: 'Montserrat', monospace;
            font-size: 2rem;
            letter-spacing: 0.35em;
            text-align: center;
            border: 1px solid var(--line);
            border-radius: var(--r-sm);
            height: 60px;
            width: 100%;
            margin: 20px 0;
            background: var(--surface-2);
            color: var(--ink);
            font-weight: 700;
            transition: all 0.2s;
            padding-left: 0.35em;
        }
        .otp-input:focus {
            border-color: var(--accent-600);
            background: #fff;
            outline: none;
            box-shadow: 0 0 0 3px rgba(31, 63, 128, 0.12);
        }

        .btn-primary-smart {
            width: 100%;
            padding: 11px 14px;
            border-radius: var(--r-sm);
            background: var(--brand-600);
            border: none;
            color: white;
            font-weight: 700;
            font-size: 0.85rem;
            transition: all 0.2s;
            box-shadow: var(--shadow-brand);
            font-family: inherit;
        }
        .btn-primary-smart:hover {
            background: #b80d14;
            color: white;
        }

        .alert-custom {
            text-align: left;
            border-radius: var(--r-sm);
            font-size: 0.8rem;
            border: 1px solid #f6cac6;
            background: #fdf3f2;
            color: #b42318;
            padding: 8px 12px;
        }
    </style>
</head>
<body>
    <div class="auth-panel">
        <img src="/static/logo.png" alt="Solar Industries India Limited" class="logo-img" onerror="this.src='/static/solars.png'">
        <h4 class="fw-bold text-dark mb-1" style="letter-spacing: -0.02em;">Two-factor authentication</h4>
        <p class="text-muted small mb-3" style="font-size: 0.78rem;">Enter the verification code sent to <br><strong class="text-dark">{{ email }}</strong></p>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}<div class="alert alert-custom py-2 mb-3">{{ messages[0] }}</div>{% endif %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="otp" class="otp-input" maxlength="6" placeholder="000000" autofocus autocomplete="off" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            <button type="submit" class="btn-primary-smart">Verify identity</button>
        </form>
        
        <div class="mt-3 pt-2 border-top" style="border-color: var(--line) !important;">
            <a href="/login" class="text-decoration-none text-muted small fw-medium" style="font-size: 0.75rem;">
                <i class="bi bi-arrow-left me-1"></i>Sign in with a different account
            </a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
