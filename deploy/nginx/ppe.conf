# PPE platform: Next.js UI on :3000, FastAPI on :8001 (same origin, so the session cookie just works)
server {
    # nginx 1.18 (Ubuntu 22.04) syntax; on 1.25+ use `listen 443 ssl;` plus `http2 on;`
    listen 443 ssl http2;
    server_name ppes-siil.solargroup.com;

    ssl_certificate     /etc/ssl/certs/ppes-siil.crt;      # adjust
    ssl_certificate_key /etc/ssl/private/ppes-siil.key;    # adjust

    # Annotation uploads: up to 100 images of 20 MB per batch in the UI
    client_max_body_size 256m;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Excel export and camera snapshots can take a while
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name ppes-siil.solargroup.com;
    return 301 https://$host$request_uri;
}
